name: CI Python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        
      - name: preparer la base de donnée
        run: bash db/setup.sh
      - name: installer python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: installer les dependances 
        working-directory: python-app
        run: pip install -r requirements.txt

      - name: lancer les tests 
        working-directory: python-app
        run: pytest -v
