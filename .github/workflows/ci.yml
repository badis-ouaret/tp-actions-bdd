
name: Pipeline complet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  
  python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-app/requirements.txt

      - name: Installer les dependances
        working-directory: python-app
        run: pip install -r requirements.txt

      - name: Lancer les tests
        working-directory: python-app
        run: pytest -v


 
  node:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node-app/package-lock.json

      - name: Installer les dependances
        working-directory: node-app
        run: npm ci

      - name: Lancer les tests
        working-directory: node-app
        run: npm test


  
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Construire et tester
        working-directory: java-app
        run: mvn -B package


  
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Installer les dependances
        working-directory: php-app
        run: composer install --no-interaction

      - name: Lancer les tests
        working-directory: php-app
        run: vendor/bin/phpunit tests


  
  build:
    runs-on: ubuntu-latest

    needs: [python, node, java, php]

    steps:
      - name: Build termine
        run: echo "Tous les tests sont reussis. Build valide !"


  
  deploy:
    runs-on: ubuntu-latest

    needs: build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploiement
        run: echo "Deploiement en cours..."

      - name: Verifier le secret
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          test -n "$TOKEN" && echo "Token present"
